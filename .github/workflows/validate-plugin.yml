name: Validate Plugin

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - 'commands/**'
      - 'bin/**'
      - 'VERSION'
      - 'package.json'
      - '.npmignore'
      - 'pytest.ini'
      - 'conftest.py'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/validate_plugin.py'
      - 'scripts/verify-package.sh'
      - '.github/workflows/validate-plugin.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate plugin manifest
        run: python3 scripts/validate_plugin.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify npm pack
        run: |
          npm pack --dry-run
          # Ensure the bin script at least executes for --help
          node bin/conductor-skills.js --version
          node bin/conductor-skills.js --help > /dev/null

      - name: Exercise installer matrix
        run: npm run verify:quick

      - name: Install Python agent example dependencies
        run: python3 -m pip install 'conductor-python[agents]==2.0.0' pytest==9.0.3 truststore==0.10.4

      - name: Run offline agent example tests
        run: |
          pytest -q skills/conductor/scripts/test_conductor_api.py
          PYTHONPATH=skills/conductor/examples/agents/python pytest -q -m "not live" skills/conductor/examples/agents/python
          PYTHONPATH=skills/conductor/examples/agent-society pytest -q -m "not live" skills/conductor/examples/agent-society
          PYTHONPATH=skills/conductor/examples/bengaluru-writers-room pytest -q -m "not live" skills/conductor/examples/bengaluru-writers-room
